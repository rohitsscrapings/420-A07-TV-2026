
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }
    header, footer {
      text-align: center;
      padding: 20px;
      background: #253858;
      color: white;
    }
    main { padding: 20px; }
    #todos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
    }
    @media (min-width: 768px) {
      #todos {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>My Todo List</h1>
    <p id="count">Loading...</p>
  </header>

  <main>
    <div id="todos"></div>
    <p id="status">Loading...</p>
  </main>

  <footer>Todo List Project</footer>

  <script>
    async function loadTodos() {
      const container = document.querySelector("#todos");
      const status = document.querySelector("#status");
      const count = document.querySelector("#count");

      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/todos?_limit=12"
        );

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const todos = await response.json();

        let completed = 0;

        for (const todo of todos) {
          if (todo.completed) completed++;

          const card = document.createElement("div");
          card.className = "card";
          card.textContent =
            todo.title + (todo.completed ? " ✅" : " ⬜");

          container.append(card);
        }

        count.textContent =
          `${completed} of ${todos.length} completed`;
        status.textContent = "";

      } catch (error) {
        status.textContent =
          "Could not load todos. Please check your connection.";
        count.textContent = "Unable to load count";
      }
    }

    loadTodos();
  </script>
</body>
</html>
